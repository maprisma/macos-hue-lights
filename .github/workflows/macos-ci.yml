name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    # macos-latest is Apple silicon (arm64), like an M4 Mac.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          sw_vers
          uname -m
          swift --version
          python3 --version

      - name: Python tests (repo & translation verification)
        run: python3 -m unittest discover -s tests -v

      - name: Swift tests (HueCore)
        run: swift test

      - name: Build app bundle
        run: ./build-mac.sh

      - name: Verify app bundle
        run: |
          set -euo pipefail
          APP="dist/Maprisma Lights.app"
          PLIST="$APP/Contents/Info.plist"
          test -d "$APP"
          test -x "$APP/Contents/MacOS/MaprismaHueLights"
          test ! -e "$APP/Contents/Resources/scripts/hue-lights.py"
          test ! -e "$APP/Contents/Resources/LICENSE"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          test -f "$APP/Contents/Resources/PrivacyInfo.xcprivacy"
          test -f "$APP/Contents/Resources/translations/bundled.json"
          plutil -lint "$PLIST"
          plutil -lint "$APP/Contents/Resources/PrivacyInfo.xcprivacy"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = "com.maprisma.lights"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")" = "Maprisma Lights"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$PLIST")" = "false"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$PLIST")" = "false"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")" = "MaprismaHueLights"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$PLIST")" = "13.0"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$PLIST"
          lipo -archs "$APP/Contents/MacOS/MaprismaHueLights" | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -q "Signature=adhoc"
          python3 - "$APP/Contents/Resources/translations/bundled.json" <<'EOF'
          import json, sys
          catalogs = json.load(open(sys.argv[1]))
          assert set(catalogs) == {"en", "de", "fr", "es", "it", "pt", "nl", "pl"}, catalogs.keys()
          EOF
          echo "Bundle OK"

      - name: Smoke-launch the app
        run: |
          APP="dist/Maprisma Lights.app"
          "$APP/Contents/MacOS/MaprismaHueLights" &
          PID=$!
          sleep 5
          kill -0 "$PID"          # still running (main window + menu bar toggle)
          kill -TERM "$PID"
          sleep 2
          ! kill -0 "$PID" 2>/dev/null

      - name: Zip app
        run: ditto -c -k --keepParent "dist/Maprisma Lights.app" "dist/Maprisma-Lights-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Maprisma-Lights-macOS
          path: dist/Maprisma-Lights-macOS.zip
