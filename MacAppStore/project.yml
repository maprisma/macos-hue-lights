name: MaprismaLights
options:
  bundleIdPrefix: com.maprisma
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"

packages:
  HueCorePkg:
    path: ..

targets:
  MaprismaLights:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: ../Sources/MaprismaHueLights
      - path: Assets.xcassets
      - path: MaprismaHueLights.storekit
        buildPhase: none
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../translations
        buildPhase: resources
        type: folder
    dependencies:
      - package: HueCorePkg
        product: HueCore
    settings:
      base:
        PRODUCT_NAME: "Maprisma Lights"
        PRODUCT_BUNDLE_IDENTIFIER: com.maprisma.lights
        DEVELOPMENT_TEAM: NTSV3ZSSAK
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: MaprismaHueLights.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.9"
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      storeKitConfiguration: MaprismaHueLights.storekit
    info:
      path: Info-MAS.plist
      properties:
        CFBundleDisplayName: "Maprisma Lights"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations: [en, de, fr, es, it, pt, nl, pl]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "© 2026 Uwe Bruckhaus. All rights reserved."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Maprisma Lights finds your Philips Hue bridge and local smart lights (Home Assistant, WLED, WiZ, LIFX, Govee, Nanoleaf, Shelly, IKEA DIRIGERA) on your local network. It talks only to your local devices."
        NSMicrophoneUsageDescription: "Optional: Maprisma Lights uses your microphone only when you start the Light Synthesizer in Microphone mode. Audio is analyzed in memory only and is never recorded or sent off your Mac."
        NSScreenCaptureUsageDescription: "Optional: Maprisma Lights uses Screen and System Audio Recording only when you start the Light Synthesizer in System Audio mode to sync lights with music or movies. Audio is analyzed in memory only and is never recorded or sent off your Mac."
        NSBonjourServices:
          - _hue._tcp
          - _home-assistant._tcp
          - _wled._tcp
          - _nanoleafapi._tcp
          - _shelly._tcp
          - _ihsp._tcp
